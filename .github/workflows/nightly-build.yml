# Build FonSyHen and publish a rolling nightly-build release.
# Runs on every push to dev/main and can be started by hand (Actions > Run workflow).
name: nightly-build

on:
  push:
    branches: [dev, main]
  workflow_dispatch:

concurrency:
  group: nightly-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  PS5_SDK_VERSION: v0.45 # https://github.com/ps5-payload-dev/sdk/releases
  PACBREW_VERSION: v0.41.1 # https://github.com/ps5-payload-dev/pacbrew-repo/releases (libcurl, openssl, zlib)
  LLVM_VERSION: 19

jobs:
  nightly-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true # kstuff-lite is optional: the build downloads kstuff.elf if it is missing
          fetch-depth: 1
          persist-credentials: false

      - name: Install host packages
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq "clang-$LLVM_VERSION" "lld-$LLVM_VERSION" "llvm-$LLVM_VERSION" ninja-build cmake xz-utils unzip librsvg2-bin python3-pyelftools
          {
            echo "LLVM_CONFIG=/usr/bin/llvm-config-$LLVM_VERSION"
            echo "TOOLCHAIN_DIR=$HOME/toolchain" # outside the checkout, cached below
            echo "PS5_PAYLOAD_SDK=$HOME/toolchain/ps5-payload-sdk"
          } >> "$GITHUB_ENV"

      - name: Cache toolchain
        id: cache
        uses: actions/cache@v4
        with:
          path: ~/toolchain
          key: toolchain-sdk-${{ env.PS5_SDK_VERSION }}-pacbrew-${{ env.PACBREW_VERSION }}

      - name: Install PS5 payload SDK + pacbrew libs
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p "$TOOLCHAIN_DIR"
          cd "$RUNNER_TEMP"
          curl -fsSL --retry 3 -o sdk.zip \
            "https://github.com/ps5-payload-dev/sdk/releases/download/$PS5_SDK_VERSION/ps5-payload-sdk.zip"
          unzip -q sdk.zip -d sdk && mv sdk/ps5-payload-sdk "$PS5_PAYLOAD_SDK"
          # FonSyHen's util needs libcurl (+ openssl, zlib, ...) and the CA bundle from
          # the prebuilt pacbrew packages in target/user/homebrew. Only headers, libs
          # and etc/ are extracted; the rest of the archive is not needed.
          hb=opt/ps5-payload-sdk/target/user/homebrew
          curl -fsSL --retry 3 \
            "https://github.com/ps5-payload-dev/pacbrew-repo/releases/download/$PACBREW_VERSION/ps5-payload-dev.tar.gz" |
            tar -xz -C "$PS5_PAYLOAD_SDK" --strip-components=2 "$hb/include" "$hb/lib" "$hb/etc"
          test -f "$PS5_PAYLOAD_SDK/target/user/homebrew/lib/libcurl.a"
          rm -rf sdk sdk.zip

      - name: Cache kstuff.elf
        uses: actions/cache@v4
        with:
          path: .cache/dependencies
          key: kstuff-${{ hashFiles('scripts/sync_dependencies.sh') }}

      - name: Build FonSyHen
        run: |
          set -euo pipefail
          chmod +x scripts/*.sh # exec bit is lost when the repo is created from a zip / on Windows
          export PATH="/usr/lib/llvm-$LLVM_VERSION/bin:$PS5_PAYLOAD_SDK/bin:$PATH"
          ./scripts/build.sh --release --jobs "$(nproc)"

      - name: Stage nightly-build
        run: |
          set -euo pipefail
          test -f build/bin/FonSyHen.elf
          rm -rf dist
          mkdir -p dist
          cp -f build/bin/FonSyHen.elf dist/FonSyHen.elf
          {
            echo "name=nightly-build"
            echo "branch=${GITHUB_REF_NAME}"
            echo "commit=${GITHUB_SHA}"
            echo "built=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "build_type=Release"
          } > dist/BUILD_INFO.txt
          (cd dist && sha256sum FonSyHen.elf BUILD_INFO.txt > SHA256SUMS)

      - name: Upload nightly-build artifact
        uses: actions/upload-artifact@v4
        with:
          name: nightly-build
          path: dist/
          if-no-files-found: error
          retention-days: 14

      - name: Publish rolling nightly-build release
        uses: ncipollo/release-action@v1
        with:
          token: ${{ github.token }}
          tag: nightly
          name: nightly-build
          commit: ${{ github.sha }}
          allowUpdates: true
          replacesArtifacts: true
          removeArtifacts: true
          prerelease: true
          makeLatest: false
          artifacts: dist/FonSyHen.elf,dist/BUILD_INFO.txt,dist/SHA256SUMS
          body: |
            Rolling **nightly-build** of FonSyHen.

            - Branch: `${{ github.ref_name }}`
            - Commit: `${{ github.sha }}`
            - Build type: Release

            Download `FonSyHen.elf`. This is not a tagged stable release.
